const lessons=[{"id":"r1","skill":"Reading","title":"Khi thành phố trở nên xanh hơn","subtitle":"The quiet value of urban gardens","topic":"Môi trường","band":5,"minutes":15,"type":"True / False / Not Given","text":"A. On an unused plot beside a railway station, residents of Bellford created a community garden in 2021. The council provided tools, but local volunteers paid for the seeds. The garden is open to visitors every afternoon.\n\nB. At first, most volunteers hoped to grow cheaper vegetables. After a year, however, many said that meeting neighbours was the most valuable outcome. A survey of 40 participants found that 28 had made at least one new friend through the project. No comparison was made with residents who did not participate.\n\nC. The garden also collects rainwater from a nearby roof. During the summer, this supplies about half the water needed by the plants. The remaining water comes from the town supply. Plans to install a larger tank have been postponed because the council has not yet approved the funding.\n\nD. Although the project occupies only a small area, its organisers believe it offers a useful model for other neighbourhoods. They caution that success depends on regular volunteers rather than simply having available land.","questions":[{"id":"r1q1","text":"The council paid for the seeds.","options":["TRUE","FALSE","NOT GIVEN"],"answer":"FALSE","evidence":"The council provided tools, but local volunteers paid for the seeds.","tag":"NOT_GIVEN_as_FALSE"},{"id":"r1q2","text":"Most survey participants made a new friend.","options":["TRUE","FALSE","NOT GIVEN"],"answer":"TRUE","evidence":"A survey of 40 participants found that 28 had made at least one new friend.","tag":"paraphrase"},{"id":"r1q3","text":"Non-participants felt less connected to their neighbours.","options":["TRUE","FALSE","NOT GIVEN"],"answer":"NOT GIVEN","evidence":"No comparison was made with residents who did not participate.","tag":"NOT_GIVEN_as_FALSE"},{"id":"r1q4","text":"Rainwater provides all the water required in summer.","options":["TRUE","FALSE","NOT GIVEN"],"answer":"FALSE","evidence":"During the summer, this supplies about half the water needed by the plants.","tag":"paraphrase"},{"id":"r1q5","text":"A larger tank has already been installed.","options":["TRUE","FALSE","NOT GIVEN"],"answer":"FALSE","evidence":"Plans to install a larger tank have been postponed.","tag":"paraphrase"},{"id":"r1q6","text":"The organisers consider consistent participation essential.","options":["TRUE","FALSE","NOT GIVEN"],"answer":"TRUE","evidence":"Success depends on regular volunteers rather than simply having available land.","tag":"paraphrase"}]},{"id":"r2","skill":"Reading","title":"Một tuần làm việc linh hoạt","subtitle":"Rethinking the working week","topic":"Công việc","band":6,"minutes":15,"type":"Multiple choice","text":"A. A small software company, Northline, tested a four-day working week for six months. Employees received their usual salary and worked 32 hours rather than 40. To avoid losing time, the team shortened meetings and created two daily periods during which internal messages could wait.\n\nB. Customer support remained available five days a week because employees took different days off. Some customers initially worried that responses would be slower. Records from the trial showed, however, that the average response time was almost unchanged. The number of customer complaints was not recorded.\n\nC. Staff reported feeling more rested, but a few found the shorter week stressful when deadlines coincided. The company therefore kept the arrangement while allowing teams to return temporarily to five days during unusually busy periods. The director said the result should not be interpreted as proof that every industry could adopt the same policy.","questions":[{"id":"r2q1","text":"How did Northline reduce distractions?","options":["By banning all messages","By introducing protected work periods","By employing fewer people"],"answer":"By introducing protected work periods","evidence":"The team ... created two daily periods during which internal messages could wait.","tag":"paraphrase"},{"id":"r2q2","text":"What happened to customer response times?","options":["They stayed broadly similar","They doubled","They were not measured"],"answer":"They stayed broadly similar","evidence":"The average response time was almost unchanged.","tag":"paraphrase"},{"id":"r2q3","text":"Why could customers still get help on Fridays?","options":["Staff worked longer hours","Employees had different days off","An outside company took over"],"answer":"Employees had different days off","evidence":"Employees took different days off.","tag":"paraphrase"},{"id":"r2q4","text":"What limitation did the director acknowledge?","options":["The trial used no employees","The findings may not apply to all industries","All deadlines were missed"],"answer":"The findings may not apply to all industries","evidence":"The result should not be interpreted as proof that every industry could adopt the same policy.","tag":"paraphrase"}]},{"id":"l1","skill":"Listening","title":"Đăng ký lớp học cuối tuần","subtitle":"A conversation at the community centre","topic":"Đời sống","band":4.5,"minutes":10,"type":"Multiple choice","text":"Receptionist: Good morning, Riverton Community Centre. How can I help?\nVisitor: I'd like to join the weekend photography course. I saw it starts at nine.\nReceptionist: That was the old schedule. It now starts at half past nine on Saturday.\nVisitor: Is it still in the main hall?\nReceptionist: No, the hall is being repaired. Please come to Room Twelve, next to the library.\nVisitor: Do I need my own camera?\nReceptionist: We can lend you one, but please bring a notebook. The fee is forty pounds for four sessions.\nVisitor: I thought it was fifty.\nReceptionist: That includes the advanced course. This beginner course is forty. Please register by Thursday afternoon.","questions":[{"id":"l1q1","text":"When does the course const publicLesson=function publicLesson(l) {
  return {
    ...l,
    questions: l.questions?.map(({ answer, evidence, tag, ...q }) => q),
  };
};
const publicDiagnostic=function publicDiagnostic(q) {
  const { answer, evidence, tag, ...rest } = q;
  return rest;
};
const estimate=function estimate(responses, skill) {
  const rows = responses.filter((r) => r.skill === skill);
  const grid = Array.from({ length: 161 }, (_, i) => -4 + i * 0.05);
  const logs = grid.map(
    (theta) =>
      -0.5 * theta ** 2 +
      rows.reduce((sum, r) => {
        const p = 1 / (1 + Math.exp(-(theta - (r.difficulty - 5) * 0.9)));
        return sum + Math.log(r.correct ? p : 1 - p);
      }, 0),
  );
  const max = Math.max(...logs),
    weights = logs.map((x) => Math.exp(x - max)),
    total = weights.reduce((a, b) => a + b, 0);
  const mean = grid.reduce((a, t, i) => a + (t * weights[i]) / total, 0);
  const sd = Math.sqrt(
    grid.reduce((a, t, i) => a + ((t - mean) ** 2 * weights[i]) / total, 0),
  );
  return {
    count: rows.length,
    correct: rows.filter((r) => r.correct).length,
    theta: mean,
    sd,
    estimate: Math.max(3, Math.min(7, 5 + mean / 0.9)),
    range: Math.min(2, (1.96 * sd) / 0.9),
  };
};
const nextItem=function nextItem(responses) {
  const skill =
    responses.filter((r) => r.skill === "Reading").length < 18
      ? "Reading"
      : "Listening";
  const e = estimate(responses, skill);
  const used = new Set(responses.map((r) => r.id));
  return diagnosticItems
    .filter((q) => q.skill === skill && !used.has(q.id))
    .sort(
      (a, b) =>
        Math.abs((a.difficulty - 5) * 0.9 - e.theta) -
        Math.abs((b.difficulty - 5) * 0.9 - e.theta),
    )[0];
};

const initialStats=[{skill:'Listening',band:5.5,accuracy:72,count:4},{skill:'Reading',band:6,accuracy:80,count:5},{skill:'Writing',band:5.5,accuracy:null,count:3},{skill:'Speaking',band:5,accuracy:null,count:2}];
const state={signedIn:true,drafts:{},attempts:[],reviews:{},placement:null};
function dashboard(){

 else if(!state.signedIn){status=401;data={error:'Vui lòng đăng nhập tài khoản minh họa.'};}
 else if(path==='/me')data=user;

 else if(path==='/dashboard')data=dashboard();

  const a={id:crypto.randomUUID(),lesson_id:l.id,skill:l.skill,response:body,result,minutes:body.minutes,created:new Date().toISOString()};state.attempts.unshift(a);data={id:a.id,...result};status=201;
 }
 else if(path==='/placement'){state.placement||={id:'preview-diagnostic',responses:[]};data=placement();}
 else if(path.startsWith('/placement/')&&path.endsWith('/answer')){const q=nextItem(state.placement.responses);state.placement.responses.push({id:q.id,skill:q.skill,difficulty:q.difficulty,correct:body.answer===q.answer});data=placement();}
 else if(path==='/recordings'&&method==='GET')data=[];
 else if(path==='/ai/generated')data=[];
 else {status=503;data={error:'Tính năng này cần server thật. Bản preview HTML không kết nối backend hoặc AI.'};}
 return new Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json'}});
};
